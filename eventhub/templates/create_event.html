{% extends "base.html" %}
{% block title %}{{ 'Edit Event' if editing else 'Host an Event' }} — EventHub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>{{ 'Edit event' if editing else 'Host a new event' }}</h2>
    <form method="post" action="{{ url_for('edit_event', event_id=event_id) if editing else url_for('create_event') }}" novalidate>
        <div class="form-group">
            <label for="title">Event title</label>
            <input type="text" id="title" name="title" value="{{ form.get('title', '') if form else '' }}" required minlength="3">
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4">{{ form.get('description', '') if form else '' }}</textarea>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    {% set current_cat = form.get('category', '') if form else '' %}
                    <option value="" disabled {% if not current_cat %}selected{% endif %}>Select category</option>
                    {% for c in ["Technology", "Health", "Business", "Education", "Arts & Culture", "Sports", "Other"] %}
                        <option value="{{ c }}" {% if current_cat == c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" value="{{ form.get('location', '') if form else '' }}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="event_date">Event date</label>
                <input type="date" id="event_date" name="event_date" value="{{ form.get('event_date', '') if form else '' }}" required>
            </div>
            <div class="form-group">
                <label for="capacity">Capacity (max seats)</label>
                <input type="number" id="capacity" name="capacity" min="1" value="{{ form.get('capacity', '') if form else '' }}" required>
            </div>
        </div>
        <button type="submit" class="btn-primary btn-full">{{ 'Save changes' if editing else 'Host this event' }}</button>
    </form>
</div>
{% endblock %}
