{% extends "base.html" %}
{% block title %}Log In — EventHub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Log in to your account</h2>
    <form method="post" action="{{ url_for('login') }}" novalidate>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ email }}" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary btn-full">Log In</button>
    </form>
    <p class="form-footer">No account yet? <a href="{{ url_for('register') }}">Sign up</a></p>
    <p class="hint">Demo admin: admin@example.com / admin123</p>
    <p class="hint">Demo organizer: arjun@example.com / arjun123</p>
</div>
{% endblock %}
