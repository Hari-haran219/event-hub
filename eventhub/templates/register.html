{% extends "base.html" %}
{% block title %}Sign Up — EventHub{% endblock %}

{% block content %}
<div class="form-card">
    <h2>Create your account</h2>
    <form method="post" action="{{ url_for('register') }}" novalidate>
        <div class="form-group">
            <label for="full_name">Full name</label>
            <input type="text" id="full_name" name="full_name" value="{{ form.get('full_name', '') }}" required minlength="2">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ form.get('email', '') }}" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" name="phone" value="{{ form.get('phone', '') }}">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
        </div>
        <button type="submit" class="btn-primary btn-full">Sign Up</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
